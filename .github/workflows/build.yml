name: build-windows

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'artifacts/**'
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: fetch-source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          curl.exe -sL -o src.zip "https://aka.doubaocdn.com/s/I3w9kLuIVs"
          Get-Item src.zip | Select-Object Length | Out-String | Tee-Object -FilePath logs/fetch.log
          Expand-Archive -Path src.zip -DestinationPath src -Force
          Get-ChildItem src -Recurse -Filter *.py | Select-Object FullName | Out-String | Tee-Object -Append -FilePath logs/fetch.log

      - name: deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip 2>&1 | Tee-Object -FilePath logs/pip.log
          python -m pip install pyinstaller pillow 2>&1 | Tee-Object -Append -FilePath logs/pip.log

      - name: icon
        shell: pwsh
        working-directory: src
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path tools/build | Out-Null
          python -c "import sys; sys.path.insert(0,'tools'); from make_icon import make_icon; make_icon().save('tools/build/app.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])" 2>&1 | Tee-Object -FilePath ..\logs\icon.log
          Get-ChildItem tools/build -Filter *.ico | Select-Object FullName,Length | Out-String | Tee-Object -Append -FilePath ..\logs\icon.log

      - name: selftest
        shell: pwsh
        working-directory: src
        continue-on-error: true
        run: |
          $out = python main.py --selftest 2>&1
          $code = $LASTEXITCODE
          $out | Tee-Object -FilePath ..\logs\selftest.log
          "SELFTEST_EXIT=$code" | Tee-Object -Append -FilePath ..\logs\selftest.log

      - name: build-app
        shell: pwsh
        working-directory: src
        run: |
          $args = @("-m","PyInstaller","--noconfirm","--clean","--windowed","--name","DeskLock","--distpath","dist-win","--workpath","build-win")
          if (Test-Path "tools/build/app.ico") { $args += @("--icon","tools/build/app.ico") }
          $args += "main.py"
          python @args 2>&1 | Tee-Object -FilePath ..\logs\build-app.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: build-unlock
        shell: pwsh
        working-directory: src
        continue-on-error: true
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name UnlockEmergency --distpath dist-unlock --workpath build-unlock tools/emergency_unlock.py 2>&1 | Tee-Object -FilePath ..\logs\build-unlock.log

      - name: publish
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path "src\dist-win\DeskLock.exe") { Copy-Item "src\dist-win\DeskLock.exe" "artifacts\DeskLock.exe" }
          if (Test-Path "src\dist-unlock\UnlockEmergency.exe") { Copy-Item "src\dist-unlock\UnlockEmergency.exe" "artifacts\UnlockEmergency.exe" }
          if (Test-Path logs) { Copy-Item logs artifacts\logs -Recurse -Force }
          Get-ChildItem artifacts | Select-Object Name,Length | Format-Table | Out-String
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts
          git commit -m "build: windows exe [skip ci]"
          git push
